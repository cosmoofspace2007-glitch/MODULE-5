  version: '3.8'

  networks:
    fintech-net:
      driver: bridge

  volumes:
    postgres_data:
    redis_data:
    prometheus_data:
    grafana_data:

  services:
    # 1. Cơ sở dữ liệu PostgreSQL (ACID Double-Entry Ledger)
    postgres:
      image: postgres:16-alpine
      container_name: fintech-postgres
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: BINH1234
      ports:
        - "5432:5432"
      volumes:
        - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - fintech-net

    # 2. Redis Cache & Lock
    redis:
      image: redis:7-alpine
      container_name: fintech-redis
      ports:
        - "6379:6379"
      command: redis-server --appendonly yes
      volumes:
        - redis_data:/data
      networks:
        - fintech-net

    # 3. Zookeeper
    zookeeper:
      image: confluentinc/cp-zookeeper:7.5.0
      container_name: fintech-zookeeper
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      networks:
        - fintech-net

    # 4. Kafka Message Broker
    kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: fintech-kafka
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
        - "29092:29092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      networks:
        - fintech-net

    # 5. Core Ledger Service (gRPC 50051 & REST 8085)
    ledger-service:
      build:
        context: .
        args:
          MODULE: AccountCoreLedgerServices
      container_name: fintech-ledger-service
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: BINH1234
        GRPC_PORT: 50051
      ports:
        - "8085:8085"
        - "50051:50051"
      networks:
        - fintech-net

    # 6. Transaction Engine (Port 8082)
    transaction-engine:
      build:
        context: .
        args:
          MODULE: TransactionProcessingEngine
      container_name: fintech-transaction-engine
      depends_on:
        - redis
        - kafka
        - ledger-service
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: BINH1234
        REDIS_HOST: redis
        REDIS_PORT: 6379
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        LEDGER_GRPC_HOST: ledger-service
        LEDGER_GRPC_PORT: 50051
        LEDGER_GRPC_ADDRESS: static://ledger-service:50051
      ports:
        - "8082:8082"
      networks:
        - fintech-net

    # 7. Payment Service (Port 8081)
    payment-service:
      build:
        context: .
        args:
          MODULE: PaymentGatewayIntegrationService
      container_name: fintech-payment-service
      depends_on:
        - transaction-engine
        - redis
      environment:
        TX_ENGINE_URL: http://transaction-engine:8082
        REDIS_HOST: redis
        REDIS_PORT: 6379
      ports:
        - "8081:8081"
      networks:
        - fintech-net

    # 8. API Gateway (Port 8080)
    api-gateway:
      build:
        context: .
        # Phải khớp tên module trong settings.gradle
        args:
          MODULE: APIGatewaySecurityProxy
      container_name: fintech-api-gateway
      depends_on:
        - redis
        - payment-service
        - transaction-engine
        - audit-service
      environment:
        REDIS_HOST: redis
        REDIS_PORT: 6379
        TX_ENGINE_URI: http://transaction-engine:8082
        PAYMENT_SERVICE_URI: http://payment-service:8081
        AUDIT_SERVICE_URI: http://audit-service:8084
      ports:
        - "8080:8080"
      networks:
        - fintech-net

    # 9. Fraud Detection (Port 8083)
    fraud-service:
      build:
        context: .
        args:
          MODULE: FraudDetectionRiskManagementService
      container_name: fintech-fraud-service
      depends_on:
        - kafka
        - redis
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: BINH1234
        REDIS_HOST: redis
        REDIS_PORT: 6379
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ports:
        - "8083:8083"
      networks:
        - fintech-net

    # 10. Notification & Audit Service (Port 8084)
    audit-service:
      build:
        context: .
        args:
          MODULE: NotificationAuditService
      container_name: fintech-audit-service
      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_started
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: BINH1234
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ports:
        - "8084:8084"
      networks:
        - fintech-net

    # 11. Giám sát Prometheus
    prometheus:
      image: prom/prometheus:v2.50.1
      container_name: fintech-prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
        - prometheus_data:/prometheus
      networks:
        - fintech-net

    # 12. Dashboard Grafana
    grafana:
      image: grafana/grafana:10.3.3
      container_name: fintech-grafana
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus
      networks:
        - fintech-net

    # 13. Nginx Reverse Proxy (HTTP REST + gRPC HTTP/2)
    nginx:
      image: nginx:alpine
      container_name: fintech-nginx
      depends_on:
        - api-gateway
        - ledger-service
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      ports:
        - "80:80"
        - "50052:50052"
      networks:
        - fintech-net
  
