global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "transaction-engine"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["transaction-engine:8082"]

  - job_name: "ledger-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["ledger-service:8085"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]