server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/payments/**

        - id: transaction-engine
          uri: ${TX_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/transactions/**

        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}