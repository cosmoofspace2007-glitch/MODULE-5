server:
  port: 8081

spring:
  application:
    name: payment-integration-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    deserialization:
      fail-on-unknown-properties: false

payment:
  transaction-engine-url: ${TX_ENGINE_URL:http://localhost:8082}
  idempotency:
    ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}