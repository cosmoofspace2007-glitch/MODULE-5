events {
    worker_connections 1024;
}

http {
    # 1. Cổng REST API Public cho Client (Port 80)
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://api-gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. Cổng gRPC HTTP/2 cho Giao tiếp Nội bộ Tốc độ Cao (Port 50052)
    server {
        listen 50052 http2;
        server_name localhost;

        location / {
            grpc_pass grpc://ledger-service:50051;
            grpc_read_timeout 10s;
            grpc_send_timeout 10s;
            error_page 502 = /error502grpc;
        }

        location = /error502grpc {
            internal;
            default_type application/grpc;
            add_header grpc-status 14;
            add_header grpc-message "Service Unavailable";
            return 204;
        }
    }
}